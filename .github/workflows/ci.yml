name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bce5dc22eda0b468ef76a977dfe3ff7 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d367491bb9a692bf612d9df88f9f # v4.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
