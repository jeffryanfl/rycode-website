<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rycode social card</title>
  <style>
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 100 900;
      src: url("../public/fonts/InterVariable.woff2") format("woff2");
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #080a10;
      color: #f8fafc;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #080a10;
    }

    .mark {
      width: 120px;
      height: 120px;
      color: rgba(248, 250, 252, 0.72);
    }

    .mark svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .name {
      font-size: 72px;
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 1;
      color: rgba(248, 250, 252, 0.92);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 56 56" fill="none">
        <rect x="1" y="1" width="54" height="54" stroke="currentColor" stroke-width="1" />
        <text x="9" y="19" fill="currentColor" font-family="Inter, sans-serif" font-size="11" font-weight="500">26</text>
        <text x="28" y="44" text-anchor="middle" fill="currentColor" font-family="Inter, sans-serif" font-size="20" font-weight="650">Ry</text>
      </svg>
    </div>
    <div class="name">Rycode</div>
  </div>
</body>
</html>
