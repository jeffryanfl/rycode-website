<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style type="text/css"><![CDATA[

@font-face { font-family: Inter; src: url("file:///tmp/iconwork/fonts/Inter-Regular.ttf"); font-weight: 400; }
@font-face { font-family: Inter; src: url("file:///tmp/iconwork/fonts/Inter-Medium.ttf"); font-weight: 500; }
