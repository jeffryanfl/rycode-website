@font-face { font-family: Inter; src: url("file:///tmp/iconwork/fonts/Inter-Bold.ttf"); font-weight: 700; }
@font-face { font-family: Newsreader; src: url("file:///tmp/iconwork/fonts/Newsreader-Regular.ttf"); font-weight: 400; }
@font-face { font-family: Newsreader; src: url("file:///tmp/iconwork/fonts/Newsreader-Medium.ttf"); font-weight: 500; }
@font-face { font-family: Newsreader; src: url("file:///tmp/iconwork/fonts/Newsreader-Italic.ttf"); font-style: italic; }
@font-face { font-family: GeistMono; src: url("file:///tmp/iconwork/fonts/GeistMono-Regular.ttf"); font-weight: 400; }
